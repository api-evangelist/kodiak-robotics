aid: kodiak-robotics
name: Kodiak Robotics
description: 'Kodiak Robotics, which now operates publicly as Kodiak AI, is an autonomous
  vehicle company founded in April 2018 by CEO Don Burnette and headquartered in California
  with a Texas operations center. Its flagship product is the Kodiak Driver, an AI-driven
  autonomy system that pairs onboard artificial intelligence with modular, swappable
  sensor hardware and offboard services so that a single driverless stack can be carried
  across different vehicle platforms. The company sells into three markets — long-haul
  trucking, defense, and industrial ground transportation — and positions driverless
  operation as a safety improvement, citing that more than 85% of U.S. truck crashes
  are caused by human error. Kodiak reports more than 2.6 million autonomous miles
  driven and over 7,000 loads delivered. Kodiak publishes no public developer API,
  API documentation, developer portal, or SDKs; enrichment probes of kodiak.ai found
  no /.well-known/ discovery documents and no api/docs/developer subdomains. It does
  publish an llms.txt, an RSS news feed, and a corporate safety report, so this profile
  is maintained as a company record rather than an API producer profile.'
